apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-hello
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: angular-hello
  template:
    metadata:
      labels:
        app: angular-hello
    spec:
      containers:
        - name: angular-hello
          image: ${IMAGE_NAME}:${IMAGE_TAG}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: angular-hello-service
  namespace: apps
spec:
  selector:
    app: angular-hello
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
  type: NodePort